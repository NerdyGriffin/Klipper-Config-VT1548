# Standalone toolchanger unit for VT-1548.
#
# No BoxTurtle is built yet, so AFC runs with zero lanes. That leaves `T0`
# unmapped, and AFC's replacement M104/M109 resolve the T index through lane
# maps only -- so KlipperScreen's `M104 T0 S<temp>` fails with
# "extruder not configured for T0".
#
# AFC's toolchanger support covers exactly this case. From the docs, standalone
# mode is "a toolchanger toolhead has no AFC unit/lane attached; filament is
# loaded manually once filament is inserted and toolhead sensor is triggered."
#
# Setting `toolchanger_unit` on [AFC_extruder extruder] makes AFC build a plain
# AFCLane for the toolhead (see AFC_extruder.py handle_connect). A plain AFCLane
# has no stepper -- extruder.ExtruderStepper() is only created by the
# AFCExtruderStepper subclass -- so this needs no motor pins, no TMC section and
# no lane hardware of any kind.
#
# `tool` is intentionally unset: on_shuttle() returns True when a toolchanger
# unit is defined but no tool object is, which is the documented path for setups
# driving the swap with custom macros. custom_tool_swap / custom_unselect are
# likewise optional and only needed if an actual tool swap is invoked.

[AFC_Toolchanger Toolchanger_1]
